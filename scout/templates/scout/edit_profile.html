{% extends 'scout/base.html' %}

{% block title %}Edit Profile — ScoutVision Pro{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
        <div>
            <h1 class="text-3xl font-semibold text-slate-900">Edit Profile</h1>
            <p class="mt-2 text-sm text-slate-600">Update your profile information and save changes.</p>
        </div>
        <a href="{% url 'user_profile' target_user.id %}" class="btn-secondary">Back to profile</a>
    </div>

    <div class="card p-6">
        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-slate-700">Username</label>
                <input type="text" value="{{ target_user.username }}" disabled class="form-input mt-2 w-full rounded-3xl border border-slate-300 bg-slate-100 p-4" />
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Email</label>
                <input type="email" value="{{ target_user.email }}" disabled class="form-input mt-2 w-full rounded-3xl border border-slate-300 bg-slate-100 p-4" />
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Bio</label>
                <textarea name="bio" rows="4" class="form-input mt-2 w-full rounded-3xl border border-slate-300 bg-white p-4">{{ profile.bio }}</textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Phone</label>
                <input name="phone" type="text" value="{{ profile.phone }}" class="form-input mt-2 w-full rounded-3xl border border-slate-300 bg-white p-4" />
            </div>
            {% if request.user.is_superuser %}
                <div>
                    <label class="block text-sm font-medium text-slate-700">Assigned Scout</label>
                    <select name="assigned_scout" class="form-input mt-2 w-full rounded-3xl border border-slate-300 bg-white p-4">
                        <option value="">None</option>
                        {% for scout in assigned_scout_options %}
                            <option value="{{ scout.id }}" {% if profile.assigned_scout and scout.id == profile.assigned_scout.id %}selected{% endif %}>{{ scout.username }}</option>
                        {% endfor %}
                    </select>
                </div>
            {% endif %}
            <div class="flex items-center justify-between gap-4">
                <button type="submit" class="btn-primary">Save changes</button>
                <a href="{% url 'user_profile' target_user.id %}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
